<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="miBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A22"/>
      <stop offset="45%" stop-color="#280E38"/>
      <stop offset="100%" stop-color="#12051B"/>
    </linearGradient>

    <!-- Glowing Studio Lights -->
    <radialGradient id="miGlowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DF4A7A" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#9333EA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#180A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="miGlowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A3D" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#E97845" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#180A22" stop-opacity="0"/>
    </radialGradient>

    <!-- Tactile Button Gradients -->
    <linearGradient id="miBtnPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5296"/>
      <stop offset="50%" stop-color="#DF1265"/>
      <stop offset="100%" stop-color="#8A003E"/>
    </linearGradient>
    <linearGradient id="miBtnSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="miShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B0212" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="500" fill="url(#miBgGrad)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="url(#miGlowPink)"/>
  <circle cx="620" cy="320" r="240" fill="url(#miGlowOrange)"/>

  <!-- Grid Blueprint Lines -->
  <g opacity="0.15">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="150" x2="740" y2="150" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="250" x2="740" y2="250" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="350" x2="740" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="450" x2="740" y2="450" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="140" y1="30" x2="140" y2="470" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="300" y1="30" x2="300" y2="470" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="460" y1="30" x2="460" y2="470" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="620" y1="30" x2="620" y2="470" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- LEFT: Cubic-Bezier Motion Curve Workspace (Width: 360) -->
  <g transform="translate(60, 60)" filter="url(#miShadow)">
    <rect width="320" height="380" rx="18" fill="#200B2E" stroke="#50186E" stroke-width="1.5"/>

    <!-- Header -->
    <text x="24" y="38" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Cubic-Bezier Motion Easing</text>
    <text x="24" y="56" font-family="'DM Sans', sans-serif" font-size="11" fill="#FF85B3">cubic-bezier(0.16, 1, 0.3, 1) · 450ms</text>

    <!-- Curve Coordinate Graph Area -->
    <g transform="translate(30, 80)">
      <rect width="260" height="200" rx="10" fill="#14061E" stroke="#3A1054" stroke-width="1"/>
      
      <!-- Coordinate Axes & Grid -->
      <line x1="20" y1="180" x2="240" y2="180" stroke="#4F1A6E" stroke-width="1"/>
      <line x1="20" y1="20" x2="20" y2="180" stroke="#4F1A6E" stroke-width="1"/>
      <line x1="20" y1="180" x2="240" y2="20" stroke="#3A1054" stroke-dasharray="3,3" stroke-width="1"/>

      <!-- Tangent Handles -->
      <line x1="20" y1="180" x2="60" y2="40" stroke="#FF5500" stroke-width="1.8"/>
      <circle cx="60" cy="40" r="5" fill="#FF5500"/>

      <line x1="240" y1="20" x2="160" y2="20" stroke="#DF1265" stroke-width="1.8"/>
      <circle cx="160" cy="20" r="5" fill="#DF1265"/>

      <!-- Smooth Easing Curve -->
      <path d="M 20,180 C 60,40 160,20 240,20" fill="none" stroke="#FF3377" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Motion Particles along Curve -->
      <circle cx="95" cy="55" r="4" fill="#FFFFFF"/>
      <circle cx="150" cy="28" r="3.5" fill="#FFE0EB"/>
      <circle cx="195" cy="22" r="3" fill="#FFB3CE"/>
    </g>

    <!-- Keyframe Timing Markers -->
    <g transform="translate(30, 305)">
      <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#9CA3AF">0ms (Impulse)</text>
      <text x="130" y="14" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FF5500" text-anchor="middle">180ms (Peak Vel)</text>
      <text x="260" y="14" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="end">450ms (Settle)</text>

      <rect y="24" width="260" height="8" rx="4" fill="#14061E"/>
      <rect y="24" width="180" height="8" rx="4" fill="url(#miBtnPrimary)"/>
      <circle cx="180" cy="28" r="7" fill="#FFFFFF" stroke="#DF1265" stroke-width="2"/>
    </g>
  </g>

  <!-- RIGHT: Multi-State Tactile Micro-Interactions (Width: 320) -->
  <g transform="translate(420, 60)" filter="url(#miShadow)">
    <rect width="320" height="380" rx="18" fill="#200B2E" stroke="#50186E" stroke-width="1.5"/>

    <text x="24" y="38" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Tactile State Choreography</text>
    <text x="24" y="56" font-family="'DM Sans', sans-serif" font-size="11" fill="#FF9E66">Hover Lift · Spring Damping · Haptic Pulse</text>

    <!-- State 1: Default State -->
    <g transform="translate(24, 75)">
      <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#A8A29E">STATE 01 · RESTING (y: 0px)</text>
      <rect y="22" width="272" height="48" rx="24" fill="#321045" stroke="#632085" stroke-width="1.2"/>
      <text x="136" y="52" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confirm Transaction &rarr;</text>
    </g>

    <!-- State 2: Active / Hover State (Elevated with Glow) -->
    <g transform="translate(24, 165)">
      <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FF6B35">STATE 02 · HOVER LIFT (y: -4px · scale: 1.03)</text>
      <!-- Glow Drop Shadow -->
      <rect y="20" width="272" height="50" rx="25" fill="none" stroke="#FF3377" stroke-width="4" opacity="0.4" filter="blur(6px)"/>
      <rect y="20" width="272" height="50" rx="25" fill="url(#miBtnPrimary)" stroke="#FF85B3" stroke-width="1.5"/>
      <text x="136" y="51" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Confirm Transaction &rarr;</text>
    </g>

    <!-- State 3: Success Spring Settle State -->
    <g transform="translate(24, 260)">
      <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#10B981">STATE 03 · SUCCESS SETTLE (Scale Bounce)</text>
      <rect y="22" width="272" height="48" rx="24" fill="url(#miBtnSuccess)" stroke="#6EE7B7" stroke-width="1.5"/>
      <text x="136" y="52" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓ Payment Verified</text>
    </g>

    <!-- Haptic Wave Resonance -->
    <g transform="translate(24, 345)">
      <circle cx="136" cy="10" r="16" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
      <circle cx="136" cy="10" r="24" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3"/>
    </g>
  </g>
</svg>

