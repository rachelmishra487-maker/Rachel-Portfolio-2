<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="50%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C202F"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5E"/>
      <stop offset="100%" stop-color="#FF2A3A"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF2A3A" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A3A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="750" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="750" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="750" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="750" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="750" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="850" cy="300" r="300" fill="url(#glowGrad)"/>

  <!-- Left Info / Context Column -->
  <g transform="translate(80, 140)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#1F2336" stroke="#2D334C" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#FF2A3A"/>
    <text x="28" y="20" fill="#FF808C" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">MOBILE APP · FINTECH</text>

    <!-- Project Identity Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700">FinPulse</text>
    <text x="0" y="125" fill="#A0A8C0" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="400">Micro-Investment &amp; Portfolio Tracker</text>

    <!-- Key UX Pillars -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="280" height="64" rx="12" fill="#151824" stroke="#252A3D" stroke-width="1"/>
      <text x="20" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Conversational Onboarding</text>
      <text x="20" y="48" fill="#75809E" font-family="'Inter', sans-serif" font-size="12">Simplified KYC &amp; risk tolerance flow</text>
    </g>

    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="280" height="64" rx="12" fill="#151824" stroke="#252A3D" stroke-width="1"/>
      <text x="20" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Automated Round-ups</text>
      <text x="20" y="48" fill="#75809E" font-family="'Inter', sans-serif" font-size="12">Micro-invest spare change seamlessly</text>
    </g>

    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="280" height="64" rx="12" fill="#151824" stroke="#252A3D" stroke-width="1"/>
      <text x="20" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Clean Data Visualization</text>
      <text x="20" y="48" fill="#75809E" font-family="'Inter', sans-serif" font-size="12">Glanceable performance analytics</text>
    </g>
  </g>

  <!-- Right: Mobile Device Mockup Container -->
  <g transform="translate(560, 60)" filter="url(#cardShadow)">
    <!-- Device Outer Shell -->
    <rect x="0" y="0" width="340" height="630" rx="44" fill="#0C0E14" stroke="#2E344A" stroke-width="4"/>

    <!-- Screen Bezel Background -->
    <rect x="12" y="12" width="316" height="606" rx="36" fill="#11141F"/>

    <!-- Dynamic Island / Speaker notch -->
    <rect x="120" y="24" width="100" height="24" rx="12" fill="#000000"/>
    <circle cx="205" cy="36" r="4" fill="#1A1F30"/>

    <!-- Status Bar -->
    <text x="36" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">9:41</text>
    <g transform="translate(265, 30)">
      <rect x="0" y="2" width="20" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="2" y="4" width="14" height="6" rx="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Header / App Bar -->
    <g transform="translate(32, 74)">
      <text x="0" y="16" fill="#8E99B7" font-family="'Inter', sans-serif" font-size="12">Total Balance</text>
      <text x="0" y="46" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700">₹84,250</text>
      <rect x="140" y="26" width="70" height="22" rx="11" fill="#183626"/>
      <text x="150" y="41" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">+14.8%</text>
    </g>

    <!-- Sparkline / Performance Curve -->
    <g transform="translate(32, 160)">
      <path d="M 0 70 C 40 60, 80 40, 130 50 C 170 60, 200 15, 252 5 L 252 100 L 0 100 Z" fill="url(#chartGrad)"/>
      <path d="M 0 70 C 40 60, 80 40, 130 50 C 170 60, 200 15, 252 5" fill="none" stroke="#FF2A3A" stroke-width="3"/>
      <circle cx="252" cy="5" r="5" fill="#FF2A3A" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(32, 280)">
      <rect x="0" y="0" width="120" height="42" rx="10" fill="url(#accentRed)"/>
      <text x="60" y="26" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" text-anchor="middle">+ Invest</text>

      <rect x="132" y="0" width="120" height="42" rx="10" fill="#1C2133" stroke="#2B324E" stroke-width="1"/>
      <text x="192" y="26" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Auto-SIP</text>
    </g>

    <!-- Allocation Cards -->
    <g transform="translate(32, 345)">
      <text x="0" y="0" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Portfolio Assets</text>

      <!-- Asset 1 -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="252" height="52" rx="10" fill="#181C2B"/>
        <circle cx="26" cy="26" r="14" fill="#252B42"/>
        <text x="26" y="31" fill="#FF2A3A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">IDX</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Nifty 50 Index</text>
        <text x="50" y="40" fill="#75809E" font-family="'Inter', sans-serif" font-size="11">55% allocation</text>
        <text x="240" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" text-anchor="end">₹46,337</text>
      </g>

      <!-- Asset 2 -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="252" height="52" rx="10" fill="#181C2B"/>
        <circle cx="26" cy="26" r="14" fill="#252B42"/>
        <text x="26" y="31" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">GLD</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Digital Gold SIP</text>
        <text x="50" y="40" fill="#75809E" font-family="'Inter', sans-serif" font-size="11">30% allocation</text>
        <text x="240" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" text-anchor="end">₹25,275</text>
      </g>

      <!-- Asset 3 -->
      <g transform="translate(0, 141)">
        <rect x="0" y="0" width="252" height="52" rx="10" fill="#181C2B"/>
        <circle cx="26" cy="26" r="14" fill="#252B42"/>
        <text x="26" y="31" fill="#34D399" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">LIQ</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Instant Liquid</text>
        <text x="50" y="40" fill="#75809E" font-family="'Inter', sans-serif" font-size="11">15% allocation</text>
        <text x="240" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" text-anchor="end">₹12,638</text>
      </g>
    </g>
  </g>

  <!-- Subtle Figma Canvas Tag -->
  <g transform="translate(1030, 40)">
    <rect x="0" y="0" width="130" height="30" rx="6" fill="#181B26" stroke="#2B3044" stroke-width="1"/>
    <text x="65" y="19" fill="#9AA4C2" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="500" text-anchor="middle">UX WIREFRAME · UI</text>
  </g>
</svg>
