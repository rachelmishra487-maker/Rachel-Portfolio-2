<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="100%" height="100%"><g transform="translate(10, 10)">
  <!-- iPhone 16 Pro Mockup Frame -->
  <defs>
    <filter id="phoneShadow_pb_mob" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#1A0D22" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="titaniumRim_pb_mob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="50%" stop-color="#B8AF9F"/>
      <stop offset="100%" stop-color="#8A8275"/>
    </linearGradient>
    <clipPath id="screenClip_pb_mob">
      <rect x="14" y="14" width="390" height="844" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <g filter="url(#phoneShadow_pb_mob)">
    <!-- Outer Titanium Chassis -->
    <rect x="8" y="8" width="402" height="856" rx="52" ry="52" fill="url(#titaniumRim_pb_mob)" stroke="#3E3832" stroke-width="2"/>
    <rect x="11" y="11" width="396" height="850" rx="49" ry="49" fill="#181514"/>
    
    <!-- Screen Surface (Clipped) -->
    <g clip-path="url(#screenClip_pb_mob)">
      <rect x="14" y="14" width="390" height="844" fill="#FAF8F5"/>
      
      <!-- Top Emergency Header Banner -->
      <g transform="translate(14, 14)">
        <rect width="390" height="180" fill="#243026"/>
        
        <!-- Subtle Street Map Geometry -->
        <g opacity="0.25">
          <line x1="20" y1="40" x2="370" y2="40" stroke="#FFFFFF" stroke-width="3"/>
          <line x1="20" y1="90" x2="370" y2="90" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="20" y1="140" x2="370" y2="140" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="90" y1="20" x2="90" y2="170" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="220" y1="20" x2="220" y2="170" stroke="#FFFFFF" stroke-width="4"/>
          <line x1="310" y1="20" x2="310" y2="170" stroke="#FFFFFF" stroke-width="2"/>
        </g>

        <!-- Emergency GPS Beacon Radar Pulse -->
        <circle cx="220" cy="90" r="40" fill="#EF4444" opacity="0.2"/>
        <circle cx="220" cy="90" r="24" fill="#EF4444" opacity="0.4"/>
        <circle cx="220" cy="90" r="12" fill="#EF4444"/>
        <text x="220" y="95" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">🚨</text>

        <!-- Top Status Bar Nav -->
        <g transform="translate(24, 46)">
          <circle cx="18" cy="18" r="18" fill="rgba(0,0,0,0.4)"/>
          <path d="M22 12 l-6 6 l6 6" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
          <text x="50" y="24" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Live SOS Dispatch</text>
        </g>

        <!-- Dispatch Telemetry Pill -->
        <g transform="translate(24, 130)">
          <rect width="210" height="26" rx="13" fill="#EF4444"/>
          <circle cx="14" cy="13" r="4" fill="#FFFFFF"/>
          <text x="26" y="17" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CODE RED · CRITICAL TRAUMA</text>
        </g>
      </g>

      <!-- Patient / Case Dossier Content -->
      <g transform="translate(38, 212)">
        <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#1C261E">Case #RC-1048: 'Leo'</text>
        <text x="0" y="44" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#6B7280">Indie Pup · Male · Est. 4 months · Sector 14 Crossing</text>

        <!-- Real-time Intake Status Strip -->
        <g transform="translate(0, 58)">
          <rect width="342" height="74" rx="12" fill="#FFFFFF" stroke="#EAE5DF" stroke-width="1"/>
          
          <g transform="translate(16, 16)">
            <text x="0" y="14" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#8F7865">INCIDENT REPORTED</text>
            <text x="0" y="34" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#1C261E">45 mins ago</text>
            <text x="0" y="48" font-family="'DM Sans', sans-serif" font-size="10" fill="#EF4444">High Urgency</text>
          </g>

          <g transform="translate(125, 16)">
            <text x="0" y="14" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#8F7865">AMBULANCE</text>
            <text x="0" y="34" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#10B981">DL-1V-3829</text>
            <text x="0" y="48" font-family="'DM Sans', sans-serif" font-size="10" fill="#059669">ETA 8 mins</text>
          </g>

          <g transform="translate(235, 16)">
            <text x="0" y="14" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#8F7865">BAY RESERVED</text>
            <text x="0" y="34" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#DF4A7A">Bay ICU-03</text>
            <text x="0" y="48" font-family="'DM Sans', sans-serif" font-size="10" fill="#76518E">Isolation Ready</text>
          </g>
        </g>

        <!-- Clinical Triage Findings -->
        <g transform="translate(0, 150)">
          <text x="0" y="16" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#1C261E">Field Triage &amp; Clinical Vitals</text>

          <g transform="translate(0, 26)">
            <rect width="342" height="110" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
            <text x="16" y="24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#991B1B">Diagnosis: Compound Tibia Fracture (Right Hind)</text>
            <text x="16" y="44" font-family="'DM Sans', sans-serif" font-size="12" fill="#7F1D1D">Open wound cleaned with Betadine, emergency splint applied by paramedic. Pre-op surgical review scheduled upon arrival.</text>
            
            <g transform="translate(16, 75)">
              <rect width="90" height="22" rx="11" fill="#FFFFFF"/>
              <text x="45" y="15" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">HR: 140 BPM</text>

              <rect x="98" width="105" height="22" rx="11" fill="#FFFFFF"/>
              <text x="150" y="15" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">CRT: 3s (SHOCK)</text>

              <rect x="211" width="95" height="22" rx="11" fill="#FFFFFF"/>
              <text x="258" y="15" font-family="'Space Grotesk', monospace" font-size="10.5" font-weight="700" fill="#991B1B" text-anchor="middle">TEMP: 38.2°C</text>
            </g>
          </g>
        </g>

        <!-- Chain of Custody & Action Protocol -->
        <g transform="translate(0, 305)">
          <text x="0" y="16" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#1C261E">Operational Chain of Custody</text>
          
          <g transform="translate(0, 26)">
            <rect width="342" height="54" rx="10" fill="#FFFFFF" stroke="#EAE5DF" stroke-width="1"/>
            <circle cx="24" cy="27" r="10" fill="#10B981" fill-opacity="0.15"/>
            <text x="24" y="31" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">✓</text>
            <text x="44" y="24" font-family="'DM Sans', sans-serif" font-size="12.5" font-weight="600" fill="#1C261E">Reporting Caller Verified</text>
            <text x="44" y="40" font-family="'DM Sans', sans-serif" font-size="11" fill="#6B7280">Rohit S. (+91 98112...) · Location Pinned</text>
            <text x="320" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="end">14:10</text>
          </g>

          <g transform="translate(0, 90)">
            <rect width="342" height="54" rx="10" fill="#FFFFFF" stroke="#EAE5DF" stroke-width="1"/>
            <circle cx="24" cy="27" r="10" fill="#F59E0B" fill-opacity="0.15"/>
            <text x="24" y="31" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">⏱</text>
            <text x="44" y="24" font-family="'DM Sans', sans-serif" font-size="12.5" font-weight="600" fill="#1C261E">Ambulance DL-1V-3829 In-Transit</text>
            <text x="44" y="40" font-family="'DM Sans', sans-serif" font-size="11" fill="#6B7280">Driver: Rajesh K. · Live GPS Active</text>
            <text x="320" y="32" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="end">14:25</text>
          </g>
        </g>

        <!-- Action Button -->
        <g transform="translate(0, 480)">
          <rect width="342" height="48" rx="24" fill="#243026"/>
          <text x="171" y="28" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Open Veterinary Surgery Queue &rarr;</text>
        </g>
      </g>

      <!-- Dynamic Island & Status Bar -->
      <g transform="translate(14, 14)">
        <rect x="135" y="10" width="120" height="30" rx="15" fill="#000000"/>
        <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">9:41</text>
        <circle cx="340" cy="24" r="4" fill="#FFFFFF"/>
        <rect x="350" y="18" width="18" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <rect x="352" y="20" width="12" height="6" rx="1" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</g></svg>

