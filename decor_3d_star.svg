<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- High-Contrast Volumetric Star Facet Gradients -->
    <linearGradient id="starLitHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#FFB338"/>
      <stop offset="70%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#C22000"/>
    </linearGradient>
    <linearGradient id="starLitMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A29"/>
      <stop offset="50%" stop-color="#E8245D"/>
      <stop offset="100%" stop-color="#9E0B3C"/>
    </linearGradient>
    <linearGradient id="starMidRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF387A"/>
      <stop offset="45%" stop-color="#BF0D50"/>
      <stop offset="85%" stop-color="#69042E"/>
      <stop offset="100%" stop-color="#3D001C"/>
    </linearGradient>
    <linearGradient id="starShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F1500"/>
      <stop offset="50%" stop-color="#550A28"/>
      <stop offset="100%" stop-color="#250215"/>
    </linearGradient>
    <linearGradient id="starShadowDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#690A1D"/>
      <stop offset="60%" stop-color="#300318"/>
      <stop offset="100%" stop-color="#14000B"/>
    </linearGradient>

    <!-- Deep Ambient Royal Purple Drop Shadow Filter -->
    <filter id="starShadowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#22042C" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#22042C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#starShadowFilter)">
    <!-- Perimeter Outer Silhouette Contour for Grounded Silhouette -->
    <polygon points="60,6 74.1,40.6 111.4,43.3 82.8,67.4 91.7,103.7 60,84 28.3,103.7 37.2,67.4 8.6,43.3 45.9,40.6" fill="none" stroke="#3A0218" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- 10 Dimensional Beveled Facets meeting at center apex (60, 60) -->
    <!-- Arm 0: Top Tip (60, 6) -->
    <polygon points="60,60 45.9,40.6 60,6" fill="url(#starLitHigh)"/>
    <polygon points="60,60 60,6 74.1,40.6" fill="url(#starLitMid)"/>

    <!-- Arm 1: Top-Right Tip (111.4, 43.3) -->
    <polygon points="60,60 74.1,40.6 111.4,43.3" fill="url(#starLitMid)"/>
    <polygon points="60,60 111.4,43.3 82.8,67.4" fill="url(#starMidRose)"/>

    <!-- Arm 2: Bottom-Right Tip (91.7, 103.7) -->
    <polygon points="60,60 82.8,67.4 91.7,103.7" fill="url(#starShadow)"/>
    <polygon points="60,60 91.7,103.7 60,84" fill="url(#starShadowDeep)"/>

    <!-- Arm 3: Bottom-Left Tip (28.3, 103.7) -->
    <polygon points="60,60 60,84 28.3,103.7" fill="url(#starShadow)"/>
    <polygon points="60,60 28.3,103.7 37.2,67.4" fill="url(#starMidRose)"/>

    <!-- Arm 4: Top-Left Tip (8.6, 43.3) -->
    <polygon points="60,60 37.2,67.4 8.6,43.3" fill="url(#starLitMid)"/>
    <polygon points="60,60 8.6,43.3 45.9,40.6" fill="url(#starLitHigh)"/>

    <!-- Beveled Ridge Line Highlights for Tactile 3D Sharpness -->
    <line x1="60" y1="60" x2="60" y2="6" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
    <line x1="60" y1="60" x2="8.6" y2="43.3" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
    <line x1="60" y1="60" x2="111.4" y2="43.3" stroke="#FFB338" stroke-width="1.8" opacity="0.85"/>
    <line x1="60" y1="60" x2="28.3" y2="103.7" stroke="#FF8533" stroke-width="1.5" opacity="0.75"/>
    <line x1="60" y1="60" x2="91.7" y2="103.7" stroke="#FF4785" stroke-width="1.5" opacity="0.65"/>

    <!-- Central Specular Highlight Apex -->
    <circle cx="60" cy="60" r="10" fill="#FFB338" opacity="0.55"/>
    <circle cx="60" cy="60" r="5.5" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="2" fill="#FFF8EB"/>
  </g>
</svg>
