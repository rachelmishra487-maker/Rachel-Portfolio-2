<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Facet Gradients for 3D Warm Volumetric Star -->
    <linearGradient id="starLitHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EA"/>
      <stop offset="25%" stop-color="#FFB37A"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="starLitMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E97845"/>
    </linearGradient>
    <linearGradient id="starMidRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E97845"/>
      <stop offset="60%" stop-color="#DF4A7A"/>
      <stop offset="100%" stop-color="#9E2A54"/>
    </linearGradient>
    <linearGradient id="starShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B43818"/>
      <stop offset="60%" stop-color="#6E1D3B"/>
      <stop offset="100%" stop-color="#3A1028"/>
    </linearGradient>
    <linearGradient id="starShadowDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#882218"/>
      <stop offset="100%" stop-color="#26081B"/>
    </linearGradient>

    <!-- Tactile Drop Shadow Filter -->
    <filter id="starShadowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3A1520" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3A1520" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#starShadowFilter)">
    <!-- 10 Dimensional Beveled Facets meeting at center apex (60, 60) -->
    <!-- Arm 0: Top Tip (60, 6) -->
    <polygon points="60,60 45.9,40.6 60,6" fill="url(#starLitHigh)"/>
    <polygon points="60,60 60,6 74.1,40.6" fill="url(#starLitMid)"/>

    <!-- Arm 1: Top-Right Tip (111.4, 43.3) -->
    <polygon points="60,60 74.1,40.6 111.4,43.3" fill="url(#starLitMid)"/>
    <polygon points="60,60 111.4,43.3 82.8,67.4" fill="url(#starMidRose)"/>

    <!-- Arm 2: Bottom-Right Tip (91.7, 103.7) -->
    <polygon points="60,60 82.8,67.4 91.7,103.7" fill="url(#starShadow)"/>
    <polygon points="60,60 91.7,103.7 60,84" fill="url(#starShadowDeep)"/>

    <!-- Arm 3: Bottom-Left Tip (28.3, 103.7) -->
    <polygon points="60,60 60,84 28.3,103.7" fill="url(#starShadow)"/>
    <polygon points="60,60 28.3,103.7 37.2,67.4" fill="url(#starMidRose)"/>

    <!-- Arm 4: Top-Left Tip (8.6, 43.3) -->
    <polygon points="60,60 37.2,67.4 8.6,43.3" fill="url(#starLitMid)"/>
    <polygon points="60,60 8.6,43.3 45.9,40.6" fill="url(#starLitHigh)"/>

    <!-- Beveled Ridge Line Highlights -->
    <line x1="60" y1="60" x2="60" y2="6" stroke="#FFFFFF" stroke-width="1.8" opacity="0.85"/>
    <line x1="60" y1="60" x2="8.6" y2="43.3" stroke="#FFFFFF" stroke-width="1.8" opacity="0.85"/>
    <line x1="60" y1="60" x2="111.4" y2="43.3" stroke="#FFA76B" stroke-width="1.4" opacity="0.7"/>
    <line x1="60" y1="60" x2="28.3" y2="103.7" stroke="#FFA76B" stroke-width="1.2" opacity="0.6"/>
    <line x1="60" y1="60" x2="91.7" y2="103.7" stroke="#DF4A7A" stroke-width="1.2" opacity="0.5"/>

    <!-- Central Specular Highlight Apex -->
    <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="9" fill="#FFB37A" opacity="0.6"/>
  </g>
</svg>
