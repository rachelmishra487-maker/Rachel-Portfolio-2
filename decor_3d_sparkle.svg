<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Facet Gradients for 3D Diamond Sparkle -->
    <linearGradient id="spkFacetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FF7CA8"/>
      <stop offset="100%" stop-color="#DF4A7A"/>
    </linearGradient>
    <linearGradient id="spkFacetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8EB4"/>
      <stop offset="50%" stop-color="#DF4A7A"/>
      <stop offset="100%" stop-color="#76518E"/>
    </linearGradient>
    <linearGradient id="spkFacetBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E66"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#A52857"/>
    </linearGradient>
    <linearGradient id="spkFacetBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#381042"/>
      <stop offset="60%" stop-color="#551D68"/>
      <stop offset="100%" stop-color="#91275E"/>
    </linearGradient>

    <!-- Deep Ambient Drop Shadow Filter -->
    <filter id="spkShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2D0E38" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2D0E38" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#spkShadow)">
    <!-- 4 Main Facets Meeting at Elevated Center Peak (60, 60) -->
    <!-- Top-Left Facet -->
    <polygon points="60,6 60,60 6,60" fill="url(#spkFacetTopLeft)"/>
    <!-- Top-Right Facet -->
    <polygon points="60,6 114,60 60,60" fill="url(#spkFacetTopRight)"/>
    <!-- Bottom-Left Facet -->
    <polygon points="6,60 60,60 60,114" fill="url(#spkFacetBottomLeft)"/>
    <!-- Bottom-Right Facet -->
    <polygon points="114,60 60,114 60,60" fill="url(#spkFacetBottomRight)"/>

    <!-- Crisp Ridge Line Highlights -->
    <line x1="60" y1="6" x2="60" y2="114" stroke="#FFFFFF" stroke-width="1.8" opacity="0.85"/>
    <line x1="6" y1="60" x2="114" y2="60" stroke="#FFFFFF" stroke-width="1.8" opacity="0.85"/>

    <!-- Specular Gleam on Center Peak -->
    <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="10" fill="#FF8EB4" opacity="0.6"/>

    <!-- Diagonal Secondary Glints -->
    <circle cx="60" cy="20" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="20" cy="60" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>

