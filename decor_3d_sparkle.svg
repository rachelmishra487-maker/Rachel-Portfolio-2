<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- High-Contrast Facet Gradients for 3D Diamond Sparkle -->
    <linearGradient id="spkFacetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8F2"/>
      <stop offset="25%" stop-color="#FF4088"/>
      <stop offset="70%" stop-color="#DF1265"/>
      <stop offset="100%" stop-color="#8A0038"/>
    </linearGradient>
    <linearGradient id="spkFacetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5C9D"/>
      <stop offset="45%" stop-color="#DF1265"/>
      <stop offset="80%" stop-color="#6F2188"/>
      <stop offset="100%" stop-color="#3C0B4F"/>
    </linearGradient>
    <linearGradient id="spkFacetBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB37A"/>
      <stop offset="30%" stop-color="#FF633E"/>
      <stop offset="75%" stop-color="#C22000"/>
      <stop offset="100%" stop-color="#6B0C25"/>
    </linearGradient>
    <linearGradient id="spkFacetBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#350842"/>
      <stop offset="50%" stop-color="#551468"/>
      <stop offset="85%" stop-color="#7B1A58"/>
      <stop offset="100%" stop-color="#9C1B4E"/>
    </linearGradient>

    <!-- Deep Ambient Royal Purple Drop Shadow Filter -->
    <filter id="spkShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#1F0329" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1F0329" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#spkShadow)">
    <!-- Perimeter Outer Silhouette Contour for Crisp Edge Contrast -->
    <polygon points="60,6 114,60 60,114 6,60" fill="none" stroke="#360844" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- 4 Main Dimensional Facets Meeting at Elevated Center Peak (60, 60) -->
    <!-- Top-Left Facet -->
    <polygon points="60,6 60,60 6,60" fill="url(#spkFacetTopLeft)"/>
    <!-- Top-Right Facet -->
    <polygon points="60,6 114,60 60,60" fill="url(#spkFacetTopRight)"/>
    <!-- Bottom-Left Facet -->
    <polygon points="6,60 60,60 60,114" fill="url(#spkFacetBottomLeft)"/>
    <!-- Bottom-Right Facet -->
    <polygon points="114,60 60,114 60,60" fill="url(#spkFacetBottomRight)"/>

    <!-- Crisp Luminous Ridge Line Highlights -->
    <line x1="60" y1="6" x2="60" y2="114" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
    <line x1="6" y1="60" x2="114" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>

    <!-- Specular Star Flare on Elevated Center Peak -->
    <circle cx="60" cy="60" r="11" fill="#FF4088" opacity="0.6"/>
    <circle cx="60" cy="60" r="6" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="2.5" fill="#FFF2F7"/>

    <!-- Perimeter Edge Highlight Glints -->
    <circle cx="60" cy="18" r="2.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="18" cy="60" r="2.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="60" cy="102" r="2" fill="#FFA26B" opacity="0.9"/>
    <circle cx="102" cy="60" r="2" fill="#FF82B0" opacity="0.9"/>
  </g>
</svg>
