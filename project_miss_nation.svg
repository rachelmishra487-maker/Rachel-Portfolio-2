<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="mnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211A27"/>
      <stop offset="60%" stop-color="#392B45"/>
      <stop offset="100%" stop-color="#1A1420"/>
    </linearGradient>
    <linearGradient id="mnRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C9E3"/>
      <stop offset="100%" stop-color="#C7A5A0"/>
    </linearGradient>
    <linearGradient id="mnCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31253C"/>
      <stop offset="100%" stop-color="#241B2C"/>
    </linearGradient>
    <filter id="mnShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#mnBgGrad)"/>

  <!-- Subtle Editorial Grid -->
  <g opacity="0.08">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="750" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="750" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="750" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="750" stroke="#F5F0F8" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="750" stroke="#F5F0F8" stroke-width="1"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="300" r="320" fill="#A68BB8" opacity="0.12"/>
  <circle cx="250" cy="550" r="280" fill="#C7A5A0" opacity="0.10"/>

  <!-- Left Header / Editorial Context -->
  <g transform="translate(80, 70)">
    <!-- Scope Tag -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#2E2238" stroke="#523D63" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#D9C9E3"/>
    <text x="28" y="21" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">LIVYANA FASHION &amp; ARTS · COMPLETED INTERNSHIP</text>

    <!-- Project Title -->
    <text x="0" y="85" fill="#F5F0F8" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Miss Nation</text>
    <text x="0" y="122" fill="#D9C9E3" font-family="'Playfair Display', Georgia, serif" font-size="24" font-style="italic">Digital Brand Platform &amp; Campaign Collateral</text>
    <text x="0" y="156" fill="#C7A5A0" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500">Responsive web interface, social collateral, and visual storytelling for national fashion initiative</text>
  </g>

  <!-- Right Visual Cards (Mockups & Campaign Strips) -->
  <g transform="translate(560, 110)">
    <!-- Card 1: Web Interface Mockup -->
    <g transform="translate(0, 0)" filter="url(#mnShadow)">
      <rect x="0" y="0" width="560" height="340" rx="14" fill="url(#mnCardGrad)" stroke="#5A446B" stroke-width="1.5"/>
      <!-- Browser Top Bar -->
      <rect x="0" y="0" width="560" height="38" rx="14" fill="#23192B"/>
      <circle cx="22" cy="19" r="5" fill="#C7A5A0"/>
      <circle cx="38" cy="19" r="5" fill="#D9C9E3"/>
      <circle cx="54" cy="19" r="5" fill="#A68BB8"/>
      <rect x="180" y="10" width="200" height="18" rx="9" fill="#392B45"/>
      <text x="280" y="23" fill="#A68BB8" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">missnation.livyana.com</text>

      <!-- Web Hero Inside Mockup -->
      <g transform="translate(25, 60)">
        <text x="0" y="28" fill="#F5F0F8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">EMPOWERING CREATIVE VOICES</text>
        <text x="0" y="50" fill="#D9C9E3" font-family="'Playfair Display', serif" font-size="15" font-style="italic">Fashion, Runway &amp; Cultural Storytelling</text>

        <!-- CTA Button -->
        <rect x="0" y="70" width="130" height="32" rx="16" fill="#A68BB8"/>
        <text x="65" y="90" fill="#211A27" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">REGISTER NOW</text>

        <!-- Gallery Grid Simulation -->
        <g transform="translate(0, 125)">
          <rect x="0" y="0" width="155" height="120" rx="8" fill="#3D2D4B" stroke="#684D7C" stroke-width="1"/>
          <text x="77" y="65" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">EDITORIAL</text>
          
          <rect x="175" y="0" width="155" height="120" rx="8" fill="#4A3459" stroke="#684D7C" stroke-width="1"/>
          <text x="252" y="65" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">RUNWAY</text>

          <rect x="350" y="0" width="155" height="120" rx="8" fill="#3D2D4B" stroke="#684D7C" stroke-width="1"/>
          <text x="427" y="65" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">ARCHIVE</text>
        </g>
      </g>
    </g>

    <!-- Card 2: Mobile Story & Social Collateral Strip -->
    <g transform="translate(40, 375)" filter="url(#mnShadow)">
      <rect x="0" y="0" width="500" height="180" rx="12" fill="#2A1F33" stroke="#503A60" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <text x="0" y="20" fill="#C7A5A0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1">PROMOTIONAL SOCIAL CAMPAIGN</text>
        <text x="0" y="44" fill="#F5F0F8" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Digital Marketing &amp; Brand Collateral</text>
        <text x="0" y="68" fill="#D9C9E3" font-family="'DM Sans', sans-serif" font-size="12">Cross-platform promotional assets maintaining strict brand consistency</text>

        <!-- Social Format Pills -->
        <g transform="translate(0, 92)">
          <rect x="0" y="0" width="100" height="26" rx="13" fill="#392B45"/>
          <text x="50" y="17" fill="#F5F0F8" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Instagram Feed</text>

          <rect x="110" y="0" width="105" height="26" rx="13" fill="#392B45"/>
          <text x="162" y="17" fill="#F5F0F8" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Story Creatives</text>

          <rect x="225" y="0" width="115" height="26" rx="13" fill="#392B45"/>
          <text x="282" y="17" fill="#F5F0F8" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Event Banners</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Left Bottom: Key Contribution Tags -->
  <g transform="translate(80, 310)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="430" height="85" rx="12" fill="#2B2135" stroke="#483659" stroke-width="1"/>
      <text x="22" y="32" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">User Flows &amp; Web Layouts</text>
      <text x="22" y="56" fill="#A68BB8" font-family="'DM Sans', sans-serif" font-size="12">Designed participant registration workflows and model portfolio showcases</text>
    </g>

    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="430" height="85" rx="12" fill="#2B2135" stroke="#483659" stroke-width="1"/>
      <text x="22" y="32" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Interactive Figma Prototypes</text>
      <text x="22" y="56" fill="#A68BB8" font-family="'DM Sans', sans-serif" font-size="12">Built high-fidelity responsive prototypes for management reviews and handoff</text>
    </g>

    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="430" height="85" rx="12" fill="#2B2135" stroke="#483659" stroke-width="1"/>
      <text x="22" y="32" fill="#D9C9E3" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Developer Alignment</text>
      <text x="22" y="56" fill="#A68BB8" font-family="'DM Sans', sans-serif" font-size="12">Collaborated on front-end feasibility, responsive breakpoints, and assets</text>
    </g>
  </g>
</svg>
