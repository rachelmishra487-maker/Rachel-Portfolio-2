<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="100%" height="100%"><g transform="translate(10, 10)">
  <!-- iPhone 16 Pro Mockup Frame -->
  <defs>
    <filter id="phoneShadow_hc_mob" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0A0F0D" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="titaniumRim_hc_mob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <clipPath id="screenClip_hc_mob">
      <rect x="14" y="14" width="390" height="844" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <g filter="url(#phoneShadow_hc_mob)">
    <!-- Outer Titanium Chassis -->
    <rect x="8" y="8" width="402" height="856" rx="52" ry="52" fill="url(#titaniumRim_hc_mob)" stroke="#1F2937" stroke-width="2"/>
    <rect x="11" y="11" width="396" height="850" rx="49" ry="49" fill="#0B0D11"/>
    
    <!-- Screen Surface (Clipped) -->
    <g clip-path="url(#screenClip_hc_mob)">
      <rect x="14" y="14" width="390" height="844" fill="#0E1116"/>
      
      <!-- Top Clinical Atmosphere Header -->
      <g transform="translate(14, 14)">
        <rect width="390" height="220" fill="#131822"/>
        <circle cx="340" cy="50" r="120" fill="#D4FF00" opacity="0.08"/>
        <circle cx="60" cy="180" r="80" fill="#3B82F6" opacity="0.06"/>

        <!-- Top Nav & Profile -->
        <g transform="translate(24, 46)">
          <circle cx="20" cy="20" r="20" fill="#1E2638" stroke="#374151" stroke-width="1"/>
          <text x="20" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#D4FF00" text-anchor="middle">AS</text>

          <text x="52" y="18" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Dr. Ananya Sharma</text>
          <text x="52" y="34" font-family="'DM Sans', sans-serif" font-size="12" fill="#94A3B8">Pediatric ICU · Shift Hour 8.5 / 12</text>

          <!-- Sanctuary Beacon Badge -->
          <rect x="250" y="6" width="90" height="26" rx="13" fill="#1F2812" stroke="#D4FF00" stroke-width="1"/>
          <circle cx="262" cy="19" r="4" fill="#D4FF00"/>
          <text x="272" y="23" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#D4FF00">ON SHIFT</text>
        </g>

        <!-- Cognitive Load Saturation Gauge -->
        <g transform="translate(24, 110)">
          <rect width="342" height="90" rx="14" fill="#1A202C" stroke="#2D3748" stroke-width="1.2"/>
          
          <g transform="translate(16, 16)">
            <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">CURRENT COGNITIVE STRAIN</text>
            <text x="0" y="38" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#EF4444">High Saturation (82%)</text>
            <text x="0" y="56" font-family="'DM Sans', sans-serif" font-size="11" fill="#CBD5E1">6.2 hrs high-frequency monitors · 3 resuscitations</text>

            <!-- Progress Bar -->
            <rect x="200" y="24" width="110" height="10" rx="5" fill="#2D3748"/>
            <rect x="200" y="24" width="90" height="10" rx="5" fill="#EF4444"/>
            <text x="305" y="48" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#EF4444" text-anchor="end">Take Debrief</text>
          </g>
        </g>
      </g>

      <!-- Decompression Interventions Body Content -->
      <g transform="translate(38, 252)">
        <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Evidence-Based Recovery Micro-Rituals</text>
        <text x="0" y="38" font-family="'DM Sans', sans-serif" font-size="12" fill="#94A3B8">Low-effort sensory down-regulation designed for surgical corridors</text>

        <!-- Ritual 1: 3-Min Acoustic Vagal Tone Stimulation -->
        <g transform="translate(0, 52)">
          <rect width="342" height="96" rx="14" fill="#161B24" stroke="#252D3D" stroke-width="1.2"/>
          
          <circle cx="36" cy="48" r="22" fill="#202A14" stroke="#D4FF00" stroke-width="1"/>
          <text x="36" y="54" font-family="sans-serif" font-size="18" text-anchor="middle">🎧</text>
          
          <text x="70" y="34" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">3-Min Acoustic Decompression</text>
          <text x="70" y="52" font-family="'DM Sans', sans-serif" font-size="12" fill="#94A3B8">0.1 Hz vagal frequency tone lowering heart rate &amp; cortisol</text>
          
          <rect x="70" y="62" width="75" height="20" rx="10" fill="#243015"/>
          <text x="107" y="76" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#D4FF00" text-anchor="middle">AUDIO PLAY</text>

          <text x="320" y="44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#D4FF00" text-anchor="end">3:00</text>
        </g>

        <!-- Ritual 2: Physical Sanctuary Pod Reservation -->
        <g transform="translate(0, 160)">
          <rect width="342" height="96" rx="14" fill="#161B24" stroke="#252D3D" stroke-width="1.2"/>
          
          <circle cx="36" cy="48" r="22" fill="#182232" stroke="#3B82F6" stroke-width="1"/>
          <text x="36" y="54" font-family="sans-serif" font-size="18" text-anchor="middle">🛋️</text>
          
          <text x="70" y="34" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Sanctuary Room B2 · Pod 04</text>
          <text x="70" y="52" font-family="'DM Sans', sans-serif" font-size="12" fill="#94A3B8">Sound-dampened pod · 2700K warm lamp · Zero monitors</text>
          
          <rect x="70" y="62" width="95" height="20" rx="10" fill="#1B2638"/>
          <text x="117" y="76" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">AVAILABLE NOW</text>

          <text x="320" y="44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#60A5FA" text-anchor="end">RESERVE</text>
        </g>

        <!-- Ritual 3: Peer Cohort Emotional Debrief Beacon -->
        <g transform="translate(0, 268)">
          <rect width="342" height="96" rx="14" fill="#161B24" stroke="#252D3D" stroke-width="1.2"/>
          
          <circle cx="36" cy="48" r="22" fill="#2E1624" stroke="#EC4899" stroke-width="1"/>
          <text x="36" y="54" font-family="sans-serif" font-size="18" text-anchor="middle">🤝</text>
          
          <text x="70" y="34" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">Night Shift Peer Support Beacon</text>
          <text x="70" y="52" font-family="'DM Sans', sans-serif" font-size="12" fill="#94A3B8">4 colleagues currently resting in Debrief Sanctuary B</text>
          
          <rect x="70" y="62" width="85" height="20" rx="10" fill="#3B172C"/>
          <text x="112" y="76" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#F472B6" text-anchor="middle">JOIN CIRCLE</text>

          <text x="320" y="44" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#F472B6" text-anchor="end">ACTIVE</text>
        </g>

        <!-- Bottom Action CTA -->
        <g transform="translate(0, 390)">
          <rect width="342" height="50" rx="25" fill="#D4FF00"/>
          <text x="171" y="30" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">Begin 3-Minute Vagal Decompression &rarr;</text>
        </g>
      </g>

      <!-- Dynamic Island & Status Bar -->
      <g transform="translate(14, 14)">
        <rect x="135" y="10" width="120" height="30" rx="15" fill="#000000"/>
        <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">02:15</text>
        <circle cx="340" cy="24" r="4" fill="#FFFFFF"/>
        <rect x="350" y="18" width="18" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <rect x="352" y="20" width="12" height="6" rx="1" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</g></svg>

