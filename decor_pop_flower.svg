<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <radialGradient id="popFlowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF94A8"/>
      <stop offset="65%" stop-color="#FA7E96"/>
      <stop offset="100%" stop-color="#E95878"/>
    </radialGradient>
    <radialGradient id="centerDome" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="50%" stop-color="#FDB97C"/>
      <stop offset="100%" stop-color="#FC5123"/>
    </radialGradient>
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5C1F2B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#flowerShadow)">
    <!-- 8 Rounded Petals -->
    <!-- Petal 1 (0 deg - Top) -->
    <path d="M100 100 C 82 50, 75 18, 100 18 C 125 18, 118 50, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 2 (45 deg) -->
    <path d="M100 100 C 120 62, 148 42, 158 60 C 168 78, 138 106, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 3 (90 deg - Right) -->
    <path d="M100 100 C 150 82, 182 75, 182 100 C 182 125, 150 118, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 4 (135 deg) -->
    <path d="M100 100 C 138 120, 158 148, 140 158 C 122 168, 94 138, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 5 (180 deg - Bottom) -->
    <path d="M100 100 C 118 150, 125 182, 100 182 C 75 182, 82 150, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 6 (225 deg) -->
    <path d="M100 100 C 80 138, 52 158, 42 140 C 32 122, 62 94, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 7 (270 deg - Left) -->
    <path d="M100 100 C 50 118, 18 125, 18 100 C 18 75, 50 82, 100 100 Z" fill="url(#popFlowerGrad)"/>
    <!-- Petal 8 (315 deg) -->
    <path d="M100 100 C 62 80, 42 52, 60 42 C 78 32, 106 62, 100 100 Z" fill="url(#popFlowerGrad)"/>

    <!-- Soft Overlay Petal Highlights -->
    <circle cx="100" cy="100" r="32" fill="#E84F72" opacity="0.4"/>
    <!-- Sunny Center Dome -->
    <circle cx="100" cy="100" r="24" fill="url(#centerDome)"/>
    <!-- Specular Glimmer -->
    <ellipse cx="94" cy="94" rx="7" ry="5" fill="#FFFFFF" opacity="0.8" transform="rotate(-30 94 94)"/>
  </g>
</svg>
