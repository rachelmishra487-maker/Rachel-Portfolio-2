    <line x1="144" y1="95" x2="127" y2="92"/>
    <line x1="137" y1="113" x2="122" y2="106"/>
    <line x1="126" y1="129" x2="113" y2="118"/>
    <line x1="111" y1="141" x2="102" y2="127"/>
    <line x1="94" y1="148" x2="89" y2="132"/>
    <line x1="75" y1="149" x2="73" y2="133"/>
