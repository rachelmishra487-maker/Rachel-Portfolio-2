  <!-- Sun Center Face Disc -->
  <circle cx="80" cy="80" r="48" fill="url(#sunGrad)"/>

  <!-- Friendly Stylized Face Details (White Linework) -->
  <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- Joyful Curved Eyes -->
    <path d="M 62 74 Q 68 67 74 74"/>
