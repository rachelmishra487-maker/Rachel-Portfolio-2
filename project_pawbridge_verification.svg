          <text x="70" y="58" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#6B7280">Donor contributions settle directly with verified pharmaceutical vendors, ensuring zero cash diversion.</text>
          <text x="70" y="76" font-family="'Space Grotesk', monospace" font-size="11" font-weight="600" fill="#10B981">HDFC ESCROW ACC #5010048291 · AUDITED QUARTERLY</text>
          
          <rect x="545" y="32" width="95" height="26" rx="13" fill="#DEF7EC"/>
          <text x="592" y="49" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700" fill="#03543F" text-anchor="middle">AUDITED</text>
        </g>

