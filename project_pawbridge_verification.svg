      <text x="48" y="22" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#1C261E">PawBridge Trust &amp; Governance</text>
      <text x="48" y="38" font-family="'DM Sans', sans-serif" font-size="12" fill="#6B7280">NGO Verification Dossier · Ministry &amp; AWBI Audit Protocol</text>

