<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="100%" height="100%"><g transform="translate(10, 10)">
  <!-- iPhone 16 Pro Mockup Frame -->
  <defs>
    <filter id="phoneShadow_si_mob" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#1A0D22" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="titaniumRim_si_mob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="50%" stop-color="#B8AF9F"/>
      <stop offset="100%" stop-color="#8A8275"/>
    </linearGradient>
    <clipPath id="screenClip_si_mob">
      <rect x="14" y="14" width="390" height="844" rx="46" ry="46"/>
    </clipPath>
  </defs>

  <g filter="url(#phoneShadow_si_mob)">
    <!-- Outer Titanium Chassis -->
    <rect x="8" y="8" width="402" height="856" rx="52" ry="52" fill="url(#titaniumRim_si_mob)" stroke="#3E3832" stroke-width="2"/>
    <rect x="11" y="11" width="396" height="850" rx="49" ry="49" fill="#181514"/>
    
    <!-- Screen Surface (Clipped) -->
    <g clip-path="url(#screenClip_si_mob)">
      <rect x="14" y="14" width="390" height="844" fill="#FAF8F5"/>
      
      <!-- Top Mobile Header Banner -->
      <g transform="translate(14, 14)">
        <rect width="390" height="150" fill="#1C1814"/>

        <!-- Top Status Bar & Language Toggle -->
        <g transform="translate(24, 46)">
          <circle cx="16" cy="16" r="16" fill="#FFF2EC"/>
          <text x="16" y="21" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="900" fill="#FF6B35" text-anchor="middle">SI</text>

          <text x="44" y="15" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Skill India Digital</text>
          <text x="44" y="28" font-family="'DM Sans', sans-serif" font-size="10" fill="#9CA3AF">PMKVY 4.0 &amp; Apprenticeship</text>

          <g transform="translate(250, 2)">
            <rect width="84" height="26" rx="13" fill="#292524" stroke="#44403C" stroke-width="1"/>
            <text x="42" y="17" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FAF8F5" text-anchor="middle">🌐 हिंदी ▾</text>
          </g>
        </g>

        <!-- Fast Task Search Bar -->
        <g transform="translate(24, 94)">
          <rect width="342" height="42" rx="21" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
          <text x="18" y="26" font-family="sans-serif" font-size="14" fill="#78716C">🔍</text>
          <text x="42" y="26" font-family="'DM Sans', sans-serif" font-size="12" fill="#78716C">Find electric vehicle, solar, welding...</text>
          <rect x="290" y="8" width="42" height="26" rx="13" fill="#FF6B35"/>
          <text x="311" y="24" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">GO</text>
        </g>
      </g>

      <!-- Mobile Content Scroll Area -->
      <g transform="translate(14, 178)">
        
        <!-- Direct Benefit Transfer (DBT) Tracker Banner -->
        <g transform="translate(16, 0)">
          <rect width="358" height="68" rx="12" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2"/>
          <circle cx="28" cy="34" r="16" fill="#FF6B35"/>
          <text x="28" y="39" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">₹</text>

          <text x="56" y="28" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#C2410C">Guaranteed Monthly Stipend</text>
          <text x="56" y="46" font-family="'DM Sans', sans-serif" font-size="11" fill="#78716C">Earn ₹8,000 to ₹12,000/mo DBT direct to Aadhaar bank</text>
        </g>

        <!-- Top Recommended Vocational Roles -->
        <g transform="translate(16, 82)">
          <text x="0" y="16" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#1C1814">Popular In Demand Trades</text>

          <!-- Card 1: Solar PV -->
          <g transform="translate(0, 28)">
            <rect width="358" height="110" rx="14" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
            
            <g transform="translate(16, 16)">
              <rect width="70" height="20" rx="10" fill="#ECFDF5"/>
              <text x="35" y="14" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">NSQF LVL 4</text>
              
              <text x="80" y="15" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#FF6B35">⚡ ₹8,000/mo Stipend</text>

              <text x="0" y="44" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#1C1814">Solar PV Rooftop Installer</text>
              <text x="0" y="62" font-family="'DM Sans', sans-serif" font-size="11" fill="#78716C">3 Months · PMKK Noida · 92% Placed</text>

              <rect x="245" y="32" width="80" height="30" rx="15" fill="#FF6B35"/>
              <text x="285" y="51" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Apply Now</text>
            </g>
          </g>

          <!-- Card 2: Electric Vehicle Technician -->
          <g transform="translate(0, 150)">
            <rect width="358" height="110" rx="14" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
            
            <g transform="translate(16, 16)">
              <rect width="70" height="20" rx="10" fill="#EFF6FF"/>
              <text x="35" y="14" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">NSQF LVL 5</text>
              
              <text x="80" y="15" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#10B981">⚡ ₹10,500/mo Stipend</text>

              <text x="0" y="44" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#1C1814">Electric Vehicle Diagnostics Tech</text>
              <text x="0" y="62" font-family="'DM Sans', sans-serif" font-size="11" fill="#78716C">4 Months · Tata Motors Hub Pune · 98% Placed</text>

              <rect x="245" y="32" width="80" height="30" rx="15" fill="#1C1814"/>
              <text x="285" y="51" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Apply Now</text>
            </g>
          </g>

          <!-- Card 3: Drone Pilot & Service Tech -->
          <g transform="translate(0, 272)">
            <rect width="358" height="110" rx="14" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
            
            <g transform="translate(16, 16)">
              <rect width="70" height="20" rx="10" fill="#FDF2F8"/>
              <text x="35" y="14" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#BE185D" text-anchor="middle">DGCA CERT</text>
              
              <text x="80" y="15" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#059669">⚡ ₹12,000/mo Stipend</text>

              <text x="0" y="44" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#1C1814">Kisan Drone Pilot &amp; Repair</text>
              <text x="0" y="62" font-family="'DM Sans', sans-serif" font-size="11" fill="#78716C">2 Months · Agri-Hub Nagpur · 95% Placed</text>

              <rect x="245" y="32" width="80" height="30" rx="15" fill="#FF6B35"/>
              <text x="285" y="51" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Apply Now</text>
            </g>
          </g>
        </g>

        <!-- Bottom DigiLocker One-Click Verification Pill -->
        <g transform="translate(16, 480)">
          <rect width="358" height="48" rx="24" fill="#10B981"/>
          <text x="179" y="30" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">
            🔒 DigiLocker Verified Profile Connected
          </text>
        </g>
      </g>

      <!-- Bottom Nav Bar -->
      <g transform="translate(14, 784)">
        <rect width="390" height="60" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
        <text x="50" y="34" font-family="sans-serif" font-size="18" fill="#FF6B35" text-anchor="middle">🏠</text>
        <text x="50" y="48" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#FF6B35" text-anchor="middle">Courses</text>

        <text x="145" y="34" font-family="sans-serif" font-size="18" fill="#9CA3AF" text-anchor="middle">💼</text>
        <text x="145" y="48" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#9CA3AF" text-anchor="middle">Jobs</text>

        <text x="245" y="34" font-family="sans-serif" font-size="18" fill="#9CA3AF" text-anchor="middle">📜</text>
        <text x="245" y="48" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#9CA3AF" text-anchor="middle">Certificates</text>

        <text x="340" y="34" font-family="sans-serif" font-size="18" fill="#9CA3AF" text-anchor="middle">👤</text>
        <text x="340" y="48" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#9CA3AF" text-anchor="middle">Profile</text>
      </g>

      <!-- iPhone Dynamic Island & Speaker -->
      <rect x="149" y="24" width="120" height="30" rx="15" fill="#000000"/>
    </g>
  </g>
</g></svg>
