<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="sunburstPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF94A8"/>
      <stop offset="70%" stop-color="#FA7E96"/>
      <stop offset="100%" stop-color="#F2587B"/>
    </radialGradient>
    <radialGradient id="orangeCrescent" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF7547"/>
      <stop offset="70%" stop-color="#FC5123"/>
      <stop offset="100%" stop-color="#E23C0E"/>
    </radialGradient>
  </defs>

  <!-- Main Radiant Hot Pink Disc -->
  <circle cx="200" cy="200" r="180" fill="url(#sunburstPink)"/>

  <!-- Radiating Sunburst Rays (Crisp White/Pastel Tints) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
    <!-- Top-Right Radiating Lines Cluster like the Reference -->
    <line x1="200" y1="200" x2="350" y2="80"/>
    <line x1="200" y1="200" x2="330" y2="60"/>
    <line x1="200" y1="200" x2="365" y2="110"/>
    <line x1="200" y1="200" x2="375" y2="145"/>
    <line x1="200" y1="200" x2="380" y2="185"/>
    <line x1="200" y1="200" x2="370" y2="225"/>
    <line x1="200" y1="200" x2="350" y2="265"/>
    <line x1="200" y1="200" x2="320" y2="300"/>
    <line x1="200" y1="200" x2="280" y2="330"/>
    <line x1="200" y1="200" x2="240" y2="355"/>
    <line x1="200" y1="200" x2="200" y2="370"/>
    <!-- Upper Ray Cluster -->
    <line x1="200" y1="200" x2="290" y2="40"/>
    <line x1="200" y1="200" x2="250" y2="30"/>
    <line x1="200" y1="200" x2="210" y2="25"/>
    <line x1="200" y1="200" x2="170" y2="30"/>
    <line x1="200" y1="200" x2="130" y2="45"/>
    <line x1="200" y1="200" x2="95" y2="70"/>
    <line x1="200" y1="200" x2="65" y2="105"/>
  </g>

  <!-- Overlapping Pop Orange Accent Disc / Crescent on Lower Left -->
  <circle cx="110" cy="290" r="110" fill="url(#orangeCrescent)"/>
</svg>

